  <title>Grupo de Corrida em Fazenda Rio Grande | FRG Run Club</title>
  <style>
    :root { color-scheme: dark; --black: #050608; --orange: #ff6413; --white: #fff; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: var(--black); }
    body { color: var(--white); font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .page { min-height: 100svh; display: grid; place-items: start center; overflow: hidden; background: radial-gradient(ellipse at 50% 35%, #131923 0, var(--black) 65%); }
    .art { position: relative; isolation: isolate; width: min(100vw, 92svh, 900px); aspect-ratio: 1 / 1; overflow: hidden; background: #090b10; }
    .art-photo { display: block; width: 100%; height: 100%; object-fit: cover; }
    .brand-mark { position: absolute; z-index: 2; top: 2.5%; right: 2.5%; display: grid; width: 9%; min-width: 38px; aspect-ratio: 1; place-items: center; overflow: hidden; border: 2px solid rgba(255,255,255,.88); border-radius: 50%; background: rgba(0,0,0,.92); box-shadow: 0 4px 18px rgba(0,0,0,.4); }
    .brand-mark img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .join { position: absolute; z-index: 3; top: 80.8%; left: 50%; display: flex; width: 51%; height: 9.2%; align-items: center; justify-content: center; transform: translateX(-50%); border: 2px solid rgba(255,255,255,.33); border-radius: 999px; background: linear-gradient(180deg, #ff7b18 0%, #ff5600 100%); box-shadow: 0 8px 22px rgba(255,87,0,.4), inset 0 1px 0 rgba(255,255,255,.32); color: #fff; font-size: clamp(11px, 2.5vw, 24px); font-weight: 900; letter-spacing: .015em; text-align: center; text-decoration: none; text-shadow: 0 1px 2px rgba(125,40,0,.25); transition: filter .18s ease, box-shadow .18s ease; }
    .join:hover, .join:focus-visible { filter: brightness(1.08); box-shadow: 0 10px 28px rgba(255,87,0,.55), inset 0 1px 0 rgba(255,255,255,.4); outline: 2px solid #fff; outline-offset: 3px; }
    .music { position: fixed; z-index: 5; right: 14px; bottom: 14px; display: grid; width: 44px; height: 44px; place-items: center; border: 1px solid rgba(255,255,255,.28); border-radius: 50%; background: rgba(0,0,0,.72); color: #fff; font-size: 18px; cursor: pointer; backdrop-filter: blur(8px); }
    .music:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (min-width: 700px) and (min-height: 700px) { .page { place-items: center; } }
    @media (max-width: 380px) { .join { font-size: 10px; } .music { right: 10px; bottom: 10px; width: 40px; height: 40px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
